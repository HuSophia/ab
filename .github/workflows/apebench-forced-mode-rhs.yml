name: APEBench forcing test with exact simulator RHS
on:
  push:
    branches: [mrpcsb-apebench-smoke]
    paths: ['.github/workflows/apebench-forced-mode-rhs.yml']
permissions:
  contents: write
jobs:
  diagnostic:
    if: github.repository == 'HuSophia/ab' && github.ref == 'refs/heads/mrpcsb-apebench-smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 26
    env:
      JAX_PLATFORMS: cpu
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: mrpcsb_smoke/requirements-apebench.txt
      - name: Install official APEBench and dependencies
        run: python -m pip install -r mrpcsb_smoke/requirements-apebench.txt
      - name: Make safe stage failures visible
        run: |
          cat > "$RUNNER_TEMP/run-stage" <<'SH'
          #!/usr/bin/env bash
          set -eu
          stage="$1"
          shift
          if ! "$@" > "$RUNNER_TEMP/ape-$stage.log" 2>&1; then
            python - "$stage" "$RUNNER_TEMP/ape-$stage.log" <<'PY'
          import pathlib, sys
          stage, path = sys.argv[1:]
          lines = pathlib.Path(path).read_text(errors="replace").splitlines()
          locs = [line.strip().split("/")[-1] for line in lines if " in " in line and "File " in line]
          exc = next((line.split(":", 1)[0] for line in reversed(lines) if line.split(":", 1)[0].isidentifier() and "Error" in line.split(":", 1)[0]), "unknown error")
          last = locs[-1].split(", in ")[0].replace('"', "") if locs else "unknown line"
          print(f"::error title=APEBench stage failed::{stage}: {exc} at {last}")
          PY
            exit 1
          fi
          SH
          chmod +x "$RUNNER_TEMP/run-stage"
      - name: Verify solver force and exact diagnostic on a tiny case
        run: |
          "$RUNNER_TEMP/run-stage" smoke-generate python mrpcsb_study/forced/generate_rhs.py --profile smoke --out "$RUNNER_TEMP/ape-smoke"
          "$RUNNER_TEMP/run-stage" smoke-evaluate python mrpcsb_study/forced/evaluate.py --input "$RUNNER_TEMP/ape-smoke/input.npz" --out "$RUNNER_TEMP/ape-smoke-eval"
      - name: Generate independent evaluation groups and evaluate exact bridge mixtures
        run: |
          "$RUNNER_TEMP/run-stage" study-generate python mrpcsb_study/forced/generate_rhs.py --profile study --out "$RUNNER_TEMP/ape-study"
          "$RUNNER_TEMP/run-stage" study-evaluate python mrpcsb_study/forced/evaluate.py --input "$RUNNER_TEMP/ape-study/input.npz" --out "$RUNNER_TEMP/ape-study-eval"
          test -s "$RUNNER_TEMP/ape-study-eval/report.md"
      - name: Publish only approved aggregates on the experiment branch
        run: |
          test ! -e mrpcsb_study/forced-mode-report.md
          cp "$RUNNER_TEMP/ape-study-eval/report.md" mrpcsb_study/forced-mode-report.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- mrpcsb_study/forced-mode-report.md
          git commit -m "Publish approved APEBench forced-mode diagnostic"
          git push origin HEAD:refs/heads/mrpcsb-apebench-smoke
