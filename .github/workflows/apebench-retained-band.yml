name: Audit retained-band physics on saved APEBench paths
on:
  push:
    branches: [mrpcsb-apebench-smoke]
    paths: ['.github/workflows/apebench-retained-band.yml']
permissions:
  actions: read
  contents: write
jobs:
  retained-band:
    if: github.repository == 'HuSophia/ab' && github.ref == 'refs/heads/mrpcsb-apebench-smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install analysis dependencies
        run: python -m pip install numpy scipy pandas
      - name: Recover the required coefficient and rollout files from run 44499102892
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_DIGEST: 37c2dd5ee58dd34126dda5540eaf84e4283206713d96d8e88a7fef9bea0b9537
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, tempfile, urllib.error, urllib.parse, urllib.request, zipfile

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          repo = "HuSophia/ab"
          base = "https://api.github.com/repos/" + repo
          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                     "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}
          auth = urllib.request.build_opener(NoRedirect())

          def api(path):
              return auth.open(urllib.request.Request(base + path, headers=headers), timeout=45)

          with api("/actions/runs/44499102892/artifacts") as f:
              matches = [a for a in json.load(f)["artifacts"]
                         if a["name"] == "apebench-kolmogorov-five-seed" and not a["expired"]]
          assert len(matches) == 1, "Completed run artifact unavailable"
          item = matches[0]
          expected = os.environ["EXPECTED_DIGEST"]
          assert item["digest"] == "sha256:" + expected, "Artifact listing digest mismatch"
          try:
              with api("/actions/artifacts/" + str(int(item["id"])) + "/zip"):
                  raise RuntimeError("Expected a download redirect")
          except urllib.error.HTTPError as e:
              if e.code not in (301, 302, 303, 307, 308):
                  raise
              location = e.headers["Location"]
              e.close()
          url = urllib.parse.urlsplit(location)
          assert url.scheme == "https" and url.hostname and not url.username
          h = hashlib.sha256()
          with tempfile.TemporaryFile() as archive:
              with urllib.request.urlopen(location, timeout=90) as f:
                  for chunk in iter(lambda: f.read(1 << 20), b""):
                      h.update(chunk)
                      archive.write(chunk)
                      assert archive.tell() < 200_000_000, "Unexpected archive size"
              assert h.hexdigest() == expected, "Downloaded artifact digest mismatch"
              with zipfile.ZipFile(archive) as z:
                  import shutil
                  cases = [f"{r}_{c}" for r in ("brownian", "physical")
                           for c in ("flat", "hierarchical")]
                  required = ["ape_study/bridge_input.npz"]
                  required += [f"ape_study/models/coupling_{case}.npz" for case in cases]
                  for case in cases:
                      for seed in range(5):
                          required += [f"ape_study/models/{case}_seed{seed}{tag}.npz"
                                       for tag in ("", "_heldout_paths")]
                  root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "ape-retained"
                  for name in required:
                      entry = z.getinfo(name)
                      assert 0 < entry.file_size < 32_000_000
                      target = root / name
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with z.open(entry) as f, target.open("wb") as o:
                          shutil.copyfileobj(f, o)
          PY
      - name: Evaluate both physical diagnostics on the frozen paths
        run: |
          base="$RUNNER_TEMP/ape-retained"
          python mrpcsb_study/retained_band.py --input "$base/ape_study/bridge_input.npz" --models "$base/ape_study/models" --out "$base/out" > "$base/audit.log"
          python mrpcsb_study/render_retained_band.py "$base/out"
          test ! -e mrpcsb_study/retained-band-report.md
          cp "$base/out/retained-band-report.md" mrpcsb_study/retained-band-report.md
      - name: Publish only the approved aggregate report on the experiment branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- mrpcsb_study/retained-band-report.md
          git commit -m "Publish approved retained-band aggregate diagnostics"
          git push origin HEAD:refs/heads/mrpcsb-apebench-smoke
