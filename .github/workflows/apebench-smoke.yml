name: APEBench Kolmogorov smoke test
on:
  push:
    branches: [mrpcsb-apebench-smoke]
    paths: ['.github/workflows/apebench-smoke.yml', 'mrpcsb_smoke/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JAX_PLATFORMS: cpu
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: mrpcsb_smoke/requirements-apebench.txt
      - name: Install official APEBench and dependencies
        run: |
          set -o pipefail
          mkdir -p logs
          python -m pip install -r mrpcsb_smoke/requirements-apebench.txt 2>&1 | tee logs/install.log
      - name: Generate official Kolmogorov smoke data
        run: |
          set -o pipefail
          python mrpcsb_smoke/prepare.py --profile smoke --out ape_smoke 2>&1 | tee logs/generate.log
      - name: Train and evaluate all four comparison arms
        run: |
          set -o pipefail
          python mrpcsb_smoke/train_paired.py \
            --input ape_smoke/bridge_input.npz --out ape_smoke/models \
            --backend numpy --seeds 1 --updates 100 --steps 200 \
            --particles 128 --batch 64 2>&1 | tee logs/train.log
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('ape_smoke/models')
          expected = {(r, c) for r in ('brownian', 'physical') for c in ('flat', 'hierarchical')}
          out = json.loads((p/'results.json').read_text())
          assert len(out) == 4 and {(x['reference'], x['coupling']) for x in out} == expected
          assert (p/'heldout_metrics.json').is_file()
          PY
      - name: Upload data, scores, and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apebench-kolmogorov-smoke
          retention-days: 7
          path: |
            logs/
            ape_smoke/bridge_input.npz
            ape_smoke/metadata.json
            ape_smoke/apebench_reference.png
            ape_smoke/models/results.json
            ape_smoke/models/heldout_metrics.json
