name: APEBench fixed-coupling forced-mode test
on:
  push:
    branches: [mrpcsb-apebench-smoke]
    paths: ['.github/workflows/apebench-forced-mode.yml']
permissions:
  contents: write
jobs:
  diagnostic:
    if: github.repository == 'HuSophia/ab' && github.ref == 'refs/heads/mrpcsb-apebench-smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 26
    env:
      JAX_PLATFORMS: cpu
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: mrpcsb_smoke/requirements-apebench.txt
      - name: Install official APEBench and dependencies
        run: python -m pip install -r mrpcsb_smoke/requirements-apebench.txt
      - name: Verify solver force and exact diagnostic on a tiny case
        run: |
          python mrpcsb_study/forced/generate.py --profile smoke --out "$RUNNER_TEMP/ape-smoke"
          python mrpcsb_study/forced/evaluate.py --input "$RUNNER_TEMP/ape-smoke/input.npz" --out "$RUNNER_TEMP/ape-smoke-eval" > "$RUNNER_TEMP/ape-smoke-eval.log"
      - name: Generate independent evaluation groups and evaluate exact bridge mixtures
        run: |
          python mrpcsb_study/forced/generate.py --profile study --out "$RUNNER_TEMP/ape-study"
          python mrpcsb_study/forced/evaluate.py --input "$RUNNER_TEMP/ape-study/input.npz" --out "$RUNNER_TEMP/ape-study-eval" > "$RUNNER_TEMP/ape-study-eval.log"
          test -s "$RUNNER_TEMP/ape-study-eval/report.md"
      - name: Publish only approved aggregates on the experiment branch
        run: |
          test ! -e mrpcsb_study/forced-mode-report.md
          cp "$RUNNER_TEMP/ape-study-eval/report.md" mrpcsb_study/forced-mode-report.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- mrpcsb_study/forced-mode-report.md
          git commit -m "Publish approved APEBench forced-mode diagnostic"
          git push origin HEAD:refs/heads/mrpcsb-apebench-smoke
